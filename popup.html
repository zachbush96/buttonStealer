<!DOCTYPE html>
<html>
<head>
  <title>Button Scraper</title>
  <style>
    body {
      min-width: 200px;
      min-height: 100px;
      font-family: 'Roboto', sans-serif;
      padding: 10px;
      background-color: #f0f0f0;
    }
    button {
      padding: 5px 10px;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #007BFF;
      color: white;
    }
  </style>
</head>
<body>
  <h3>Button Scraper</h3>
  <button id="fetch-buttons">Fetch Collected Buttons</button>
  <div id="status"></div>
  <div id="buttons-container"></div>

  <script src="popup.js"></script>
</body>
</html>
